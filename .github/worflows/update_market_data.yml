name: Update Market Data

on:
  schedule:
    # Runs every day at 06:00 UTC (after US markets close previous day)
    - cron: "0 6 * * 1-5"   # Monday–Friday only

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance numpy pandas curl_cffi

      - name: Run update script
        run: |
          python scripts/update_data.py

      - name: Commit and push updated CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.csv
          git diff --staged --quiet || git commit -m "chore: update market data $(date -u '+%Y-%m-%d')"
          git push
